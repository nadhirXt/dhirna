name: Release Dhirna (Windows & Linux Installers)

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-package-extension:
    name: Tests & Browser Extension (.zip)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Run unit tests & verify core sync
        run: |
          npm test
          npm run check-core

      - name: Build browser extension archive
        run: npm run package

      - name: Upload extension artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dhirna-extension
          path: dist/dhirna-extension-v*.zip

  build-desktop:
    name: Build Desktop (${{ matrix.os_name }})
    needs: [verify-and-package-extension]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            os_name: linux
            bundles: deb,appimage
          - platform: windows-latest
            os_name: windows
            bundles: msi,nsis
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Verify core sync
        run: node scripts/sync-core.mjs --check

      - name: Install Linux Tauri & AppImage dependencies
        if: matrix.os_name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils file
          sudo apt-get install -y libfuse2t64 || sudo apt-get install -y libfuse2

      - name: Setup Rust stable toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - name: Run Rust unit tests
        working-directory: desktop/src-tauri
        run: cargo test --locked || cargo test

      - name: Build Tauri installers (.deb, .AppImage, .msi, .exe)
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          NO_STRIP: "true"
        with:
          projectPath: desktop/src-tauri
          args: --bundles ${{ matrix.bundles }}
          includeUpdaterJson: false

      - name: Collect Linux installers (.deb, .AppImage)
        if: matrix.os_name == 'linux'
        run: |
          mkdir -p release-artifacts
          find desktop/src-tauri/target/release/bundle -type f \( -name "*.deb" -o -name "*.AppImage" \) \
            -exec cp {} release-artifacts/ \;
          tar -czf release-artifacts/dhirna-desktop-linux-x86_64.tar.gz \
            -C desktop/src-tauri/target/release dhirna-desktop

      - name: Collect Windows installers (.exe, .msi)
        if: matrix.os_name == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-artifacts | Out-Null
          Get-ChildItem -Path desktop/src-tauri/target/release/bundle -Recurse -Include *.msi,*.exe |
            ForEach-Object { Copy-Item $_.FullName -Destination release-artifacts/ }

      - name: Upload Desktop installers
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dhirna-desktop-${{ matrix.os_name }}
          path: release-artifacts/

  publish-github-release:
    name: Publish GitHub Release
    needs: [verify-and-package-extension, build-desktop]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download build artifacts & compute SHA256SUMS.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p final-release
          gh run download "${{ github.run_id }}" --dir downloaded
          find downloaded -type f -exec cp {} final-release/ \;
          (cd final-release && sha256sum * > SHA256SUMS.txt)

      - name: Create GitHub Release with all binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release create "$TAG" final-release/* \
            --title "Dhirna $TAG" \
            --notes "Installeurs officiels Windows (.exe NSIS, .msi), Linux (.AppImage, .deb, .tar.gz), extension navigateur (.zip) et empreintes SHA256SUMS.txt." \
            --verify-tag
